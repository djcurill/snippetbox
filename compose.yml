services:
  db:
    image: postgres:18
    restart: always
    ports:
      - "5432:5432"

    # sets the size of /dev/shm inside the container. Default is 64mb.
    # This is a ram backed temporary filesystem used for shared memory
    # between processes
    shm_size: 128mb

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./scripts/db_init:/docker-entrypoint-initdb.d:ro

